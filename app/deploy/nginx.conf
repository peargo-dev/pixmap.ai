worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # CF sends visitor IP in this header; fall back to $remote_addr for local :5001.
    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    include /etc/nginx/conf.d/cors-origins.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/octet-stream
        image/svg+xml;


    # Extract hostname from Origin for same-origin WebSocket checks.
    map $http_origin $ws_origin_host {
        default "";
        "~^https?://([^/:]+)" $1;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $client_ip;
    proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;

    # ── HTTP — serves content directly (cloudflared terminates TLS at edge) ───
    server {
        listen 80 default_server;
        server_name pixmap.fun dev.pixmap.fun;

        include /etc/nginx/conf.d/cloudflare-ips.conf;

        include /etc/nginx/conf.d/nginx-locations.conf;
    }

    # ── Production HTTPS (origin certs; static tiles/history on disk) ────────
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name pixmap.fun dev.pixmap.fun;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        include /etc/nginx/conf.d/cloudflare-ips.conf;

        include /etc/nginx/conf.d/nginx-locations.conf;
    }

    # ── Local dev (port 5001) — localhost-only via docker publish binding ────
    server {
        listen 5001;
        server_name _;

        include /etc/nginx/conf.d/nginx-locations.conf;
    }
}
