# Included inside each server {} block in nginx.conf
#
# Only paths with files on disk are listed here. Everything else falls
# through to uvicorn (@app) — no route whitelist to maintain.

location /ws {
    set $deny_ws 0;
    if ($http_origin != "") {
        set $deny_ws 1;
    }
    if ($cors_origin != "") {
        set $deny_ws 0;
    }
    if ($ws_origin_host = $host) {
        set $deny_ws 0;
    }
    if ($deny_ws = 1) {
        return 403;
    }

    set $upstream http://app:5001;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_pass $upstream;
}

location /nsws {
    set $upstream http://app:5001;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_pass $upstream;
}

location /mcws {
    set $upstream http://app:5001;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_pass $upstream;
}

location /tiles/ {
    alias /var/www/tiles/;
    add_header Cache-Control "public, max-age=600";
}

location /history/chunk/ {
    alias /var/www/ppbc/history/;
    add_header Cache-Control "public, max-age=31536000";
}

location /assets/ {
    root /var/www/dist;
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
}

location /uploads/ {
    root /var/www;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri @app;
}

# SPA pages live in nginx's dist (not the app container)
location = / {
    root /var/www/dist;
    try_files /index.html =404;
}

location = /index.html {
    root /var/www/dist;
    try_files $uri =404;
}

location = /select-account {
    root /var/www/dist;
    try_files /index.html =404;
}

# other dist files (favicon, …); anything else → uvicorn
location / {
    root /var/www/dist;
    try_files $uri @app;
}

location @app {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        add_header Content-Length 0;
        return 204;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;

    set $upstream http://app:5001;
    proxy_pass $upstream;
}
