services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./tiles:/app/tiles
      - history_data:/var/www/history
      - /var/www/ppbc/history:/var/www/ppbc/history:ro

  history:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "nice", "-n", "15", "python", "-m", "src.history_worker" ]
    env_file: .env
    environment:
      - BACKUP_REDIS_URL=redis://redis_backup:6379
      - HISTORY_DIR=/var/www/ppbc/history
    depends_on:
      redis:
        condition: service_healthy
      redis_backup:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - history_data:/var/www/history
      - /var/www/ppbc/history:/var/www/ppbc/history

  mariadb:
    image: mariadb:11
    env_file: .env
    command: --performance_schema=ON
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb", "-u${MARIADB_USER}", "-p${MARIADB_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "0",
      "--maxmemory-policy", "noeviction"
    ]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - /var/www/pixmapredis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -Fq PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis_backup:
    image: redis:7-alpine
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "0",
      "--maxmemory-policy", "noeviction"
    ]
    volumes:
      - /var/www/pixmapredis_backup:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -Fq PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    build:
      context: ./deploy
      dockerfile: Dockerfile.nginx
    env_file: .env
    environment:
      - PIXMAP_DEV_SSL=${PIXMAP_DEV_SSL:-0}
    depends_on:
      - app
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    ports:
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./deploy/nginx-entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx-locations.conf:/etc/nginx/conf.d/nginx-locations.conf:ro
      - ./deploy/cloudflare-ips.conf:/etc/nginx/conf.d/cloudflare-ips.conf:ro
      - ${PIXMAP_SSL_CERT_DIR:-/etc/nginx/ssl}:/etc/nginx/ssl
      - ./tiles:/var/www/tiles:ro
      - ./dist:/var/www/dist:ro
      - history_data:/var/www/history:ro
      - /var/www/ppbc/history:/var/www/ppbc/history:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
  redis_backup_data:
  history_data:
